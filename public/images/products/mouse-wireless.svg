<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgMouse)"/>
  <!-- Mouse Silhouette -->
  <g transform="translate(135, 45)">
    <!-- Shadow -->
    <ellipse cx="65" cy="195" rx="60" ry="14" fill="#000000" opacity="0.12"/>
    <!-- Body -->
    <rect x="15" y="15" width="100" height="170" rx="50" fill="url(#mouseBody)" stroke="#475569" stroke-width="2"/>
    <!-- Scroll Wheel & Seam -->
    <line x1="65" y1="15" x2="65" y2="75" stroke="#475569" stroke-width="2"/>
    <rect x="58" y="35" width="14" height="28" rx="7" fill="url(#accent)"/>
    <circle cx="65" cy="49" r="2" fill="#ffffff"/>
    <!-- Grip accents -->
    <path d="M18 70 Q 22 105 18 140" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M112 70 Q 108 105 112 140" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Logitech badge -->
    <circle cx="65" cy="140" r="10" fill="none" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="200" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">MOUSE WIRELESS LOGITECH</text>
</svg>
