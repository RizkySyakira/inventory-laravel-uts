<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHvs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="reams" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgHvs)"/>
  <g transform="translate(100, 55)">
    <!-- Shadow -->
    <polygon points="20,185 220,185 200,165 0,165" fill="#000000" opacity="0.12"/>
    <!-- Stack of Paper / Ream (isometric) -->
    <!-- Bottom paper sheets line -->
    <polygon points="10,130 190,130 200,160 20,160" fill="#f8fafc" stroke="#cbd5e1"/>
    <polygon points="10,100 190,100 200,130 20,130" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- PaperOne Wrapper -->
    <polygon points="0,50 180,50 190,105 10,105" fill="url(#reams)" stroke="#075985" stroke-width="2"/>
    <!-- Top Face -->
    <polygon points="25,10 205,10 180,50 0,50" fill="#38bdf8" stroke="#075985" stroke-width="2"/>
    <!-- Right side face -->
    <polygon points="205,10 215,65 190,105 180,50" fill="#0369a1" stroke="#075985" stroke-width="2"/>
    <!-- Branding Label -->
    <rect x="35" y="60" width="120" height="34" rx="4" fill="#ffffff"/>
    <text x="95" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle">PaperOne</text>
    <text x="95" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">ALL PURPOSE A4 80 GSM</text>
  </g>
  <text x="200" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">KERTAS HVS A4 80GR PAPERONE</text>
</svg>
