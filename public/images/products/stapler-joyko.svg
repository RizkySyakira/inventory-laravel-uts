<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStapler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="staplerSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgStapler)"/>
  <g transform="translate(70, 70)">
    <!-- Shadow -->
    <ellipse cx="130" cy="140" rx="120" ry="12" fill="#000000" opacity="0.12"/>
    <!-- Base Plate -->
    <rect x="10" y="115" width="240" height="18" rx="4" fill="url(#staplerSteel)" stroke="#0f172a" stroke-width="2"/>
    <rect x="25" y="110" width="30" height="7" rx="2" fill="url(#metalSilver)"/>
    <!-- Hinge -->
    <rect x="200" y="70" width="45" height="50" rx="6" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <circle cx="222" cy="85" r="7" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <!-- Stapler Arm (Tilted) -->
    <g transform="rotate(-8 222 85)">
      <rect x="20" y="60" width="210" height="32" rx="6" fill="url(#staplerSteel)" stroke="#0f172a" stroke-width="2"/>
      <!-- Magazine / Steel core -->
      <rect x="20" y="80" width="180" height="12" fill="url(#metalSilver)" stroke="#475569"/>
      <!-- Handle Rubber Cover -->
      <path d="M 30 55 L 210 55 Q 220 55 220 70 L 220 72 L 30 72 Z" fill="#d97706"/>
      <!-- Joyko Label -->
      <text x="120" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">JOYKO HD-12N</text>
    </g>
  </g>
  <text x="200" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">STAPLER HEAVY DUTY JOYKO HD-12N</text>
</svg>
