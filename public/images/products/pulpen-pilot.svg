<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgPen)"/>
  <g transform="translate(60, 110) rotate(-20)">
    <!-- Shadow -->
    <rect x="5" y="25" width="280" height="15" rx="7" fill="#000000" opacity="0.1"/>
    <!-- Pen Barrel -->
    <rect x="70" y="8" width="160" height="16" rx="4" fill="url(#penBody)"/>
    <!-- Rubber Grip -->
    <rect x="35" y="8" width="38" height="16" rx="3" fill="url(#grip)"/>
    <!-- Grip lines -->
    <line x1="42" y1="8" x2="42" y2="24" stroke="#0f172a" stroke-width="1"/>
    <line x1="49" y1="8" x2="49" y2="24" stroke="#0f172a" stroke-width="1"/>
    <line x1="56" y1="8" x2="56" y2="24" stroke="#0f172a" stroke-width="1"/>
    <line x1="63" y1="8" x2="63" y2="24" stroke="#0f172a" stroke-width="1"/>
    <!-- Cone & Tip -->
    <polygon points="35,8 35,24 15,18 15,14" fill="#94a3b8"/>
    <polygon points="15,14 15,18 5,16" fill="#38bdf8"/>
    <circle cx="5" cy="16" r="1.5" fill="#0284c7"/>
    <!-- Clicker & Clip -->
    <rect x="230" y="9" width="30" height="14" rx="2" fill="#475569"/>
    <rect x="260" y="11" width="16" height="10" rx="3" fill="#cbd5e1"/>
    <path d="M255 7 L170 7 L170 12 L255 12" fill="#0284c7"/>
    <circle cx="170" cy="9.5" r="3" fill="#0284c7"/>
    <!-- Pilot text -->
    <text x="140" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#ffffff" letter-spacing="1">PILOT G-2 0.5</text>
  </g>
  <text x="200" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#44403c" text-anchor="middle">PULPEN GEL PILOT G2 0.5 BLACK</text>
</svg>
